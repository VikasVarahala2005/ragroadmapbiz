<!DOCTYPE html>

        </nav>

    <main>
        <div class="card">
            <h1>RAG References & Resource Links</h1>
            <p>Add new study materials and reference links. Submitted links are stored dynamically via JavaScript in your browser storage.</p>

            <form id="link-upload-form" class="upload-form">
                <input type="text" id="link-title" class="input-field" placeholder="Resource Title (e.g., LangChain Docs)" required>
                <input type="url" id="link-url" class="input-field" placeholder="Resource URL (https://...)" required>
                <button type="submit" class="btn-submit">Add Link</button>
            </form>

            <h2>Uploaded Links</h2>
            <ul id="reference-links" class="resource-list">
                <!-- Javascript will inject uploaded links here -->
            </ul>
        </div>
    </main>

    <script src="script.js"></script>
</body>
